[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenix-voice"
version = "0.1.0"
description = "Reconnaissance vocale adaptative locale et contrôle Windows sans boîte de dictée, pensée pour les voix dysarthriques et atypiques"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "HandigamerFR" }
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "sounddevice>=0.5.0",
    "onnx>=1.17.0",
    "onnxruntime-directml>=1.19.0",
    "huggingface-hub>=0.25.0",
    "tokenizers>=0.20.0",
    "PySide6>=6.7.0",
    "pynput>=1.7.7",
    "uiautomation>=2.0.20",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
phenix-voice = "phenix_voice.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phenix_voice"]
